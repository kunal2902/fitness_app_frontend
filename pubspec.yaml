name: fitness_app
description: Fitness application - Phase 1 (onboarding + signup)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  # Color.withValues() and PopScope.onPopInvokedWithResult need 3.27+.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Vendor-neutral vector maps. Keep this exact: 0.23's published Android
  # package targets Java 21, while this app's Android toolchain uses JDK 17.
  maplibre_gl: 0.22.0

  # Media
  image_picker: ^1.1.2
  video_player: 2.9.2

  # Realtime — chat and WebRTC signalling share one socket
  socket_io_client: ^3.1.6

  # Peer-to-peer audio/video. Media never touches our server.
  flutter_webrtc: ^1.6.0

  # Ringing while backgrounded: FCM data messages on Android,
  # PushKit VoIP on iOS, both surfaced through CallKit.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_callkit_incoming: ^3.1.5

  # Local persistence (backs the BLoC layer)
  shared_preferences: ^2.3.2
  # v10 migrates the v9 Android encrypted-preferences tokens and resolves the
  # modern web interop required by MapLibre. Do not jump directly to v11.
  flutter_secure_storage: ^10.3.2

  # Read-only HealthKit / Health Connect access. Device records are reduced
  # to daily summaries before they leave the phone.
  health: 13.3.2

  # Periodic, OS-managed health sync. WorkManager may defer jobs for battery
  # and connectivity, so foreground refresh remains the immediate path.
  workmanager: 0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
