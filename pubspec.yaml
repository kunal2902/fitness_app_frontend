name: fitness_app
description: Fitness application - Phase 1 (onboarding + signup)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  # Color.withValues() and PopScope.onPopInvokedWithResult need 3.27+.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Media
  image_picker: ^1.1.2

  # Realtime — chat and WebRTC signalling share one socket
  socket_io_client: ^3.1.6

  # Peer-to-peer audio/video. Media never touches our server.
  flutter_webrtc: ^1.6.0

  # Ringing while backgrounded: FCM data messages on Android,
  # PushKit VoIP on iOS, both surfaced through CallKit.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_callkit_incoming: ^3.1.5

  # Local persistence (backs the BLoC layer)
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
